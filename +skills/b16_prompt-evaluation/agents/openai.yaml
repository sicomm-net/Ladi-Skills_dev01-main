interface:
  display_name: evaluate prompt
  short_description: Evaluates the quality of user prompts and teaches users to write more
    effective instructions using the Czech mnemonic CO – PROČ – Z ČEHO – KOMU – POZOR NA
    (WHAT – WHY – FROM WHAT – FOR WHOM – WATCH OUT FOR). Use when the user wants to
    evaluate, score, check, or improve a prompt, is practicing prompt engineering,
    asks for feedback on an instruction for ChatGPT, or wants to find out what is
    missing from a prompt. Always evaluate against the actual environment in which
    the prompt is to run; do not require again rules already ensured by an active
    Skill, GPT, or Agent.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
