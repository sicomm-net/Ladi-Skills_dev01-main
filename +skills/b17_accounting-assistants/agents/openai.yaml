interface:
  display_name: accounting assistant
  short_description: Professional AI assistant for an accounting office in the Czech Republic.
    Use for Czech accounting, tax, payroll, and related labor-law questions,
    work with accounting documents and posting proposals, professional research,
    and questions about accounting or tax software. The skill emphasizes current
    verification of legislation, primary Czech sources, precise citations, protection
    of client data, and a clear distinction between verified facts, professional
    interpretation, and working hypotheses.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
